#
# Checks the structure of the course wiki in `wiki/` on every push and pull
# request: broken links, missing parents, cycles, duplicate ids.
#
# You do not have to install anything. The check runs entirely on GitHub's
# runners. If you do not want it, delete this file — the wiki still works.

name: wiki

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: structure check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned to a commit, not a branch. The Action builds its CLI from
      # whatever revision it is pinned at and caches the binary on that commit,
      # so this restores a cached binary on every run after the first; @main
      # would rebuild whenever berrywiki moves. Bump it deliberately.
      - uses: metadatastician/berrywiki@0b49e2b2a378ccb2fed76a66908e50f1e9524184 # berrywiki check
        with:
          path: wiki
          # Set this to 'true' once your tree is clean and you want it to stay
          # that way: it fails the build on warnings (a broken link, a missing
          # parent) as well as on errors (a duplicate id).
          strict: 'false'
